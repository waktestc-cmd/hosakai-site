# Publishes site/ to GitHub Pages (breachmatrix.com) on every push to main
# that touches the site. Runs the design checker first: a page that breaks
# the design rules does not go live.
name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "services/waitlist/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test the waitlist service
        run: node --test services/waitlist/worker.test.mjs
      - name: Check the design rules
        run: python3 .claude/skills/hosakai-ice-design/scripts/check_design.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
